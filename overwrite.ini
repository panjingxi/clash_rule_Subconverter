[custom]

; 高优先级自定义规则放最前面
ruleset=节点选择,[]DOMAIN-SUFFIX,anyrouter.top

ruleset=电报消息,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo-lite/geosite/telegram.mrs
ruleset=流媒体,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo-lite/geosite/proxymedia.mrs
ruleset=AI服务,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo-lite/geosite/openai.mrs

ruleset=全球直连,[]DOMAIN-SUFFIX,local
ruleset=全球直连,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo-lite/geosite/cn.mrs
ruleset=全球直连,clash-ipcidr:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo-lite/geoip/cn.mrs

ruleset=漏网之鱼,[]FINAL

custom_proxy_group=节点选择`select`[]自动选择`[]CF官方优选`[]手动切换`[]DIRECT
custom_proxy_group=自动选择`url-test`.*`http://www.gstatic.com/generate_204`1600,,50
custom_proxy_group=手动切换`select`.*

custom_proxy_group=CF官方优选`url-test`(CF官方优选)`http://www.gstatic.com/generate_204`3200,,50
custom_proxy_group=DNS出口`select`[]节点选择`[]自动选择`[]DIRECT
custom_proxy_group=电报消息`select`[]节点选择`[]自动选择`[]DIRECT
custom_proxy_group=AI服务`select`[]节点选择`[]自动选择
custom_proxy_group=流媒体`select`[]节点选择`[]自动选择`[]DIRECT
custom_proxy_group=全球直连`select`[]DIRECT`[]节点选择
custom_proxy_group=漏网之鱼`select`[]节点选择`[]自动选择`[]DIRECT

enable_rule_generator=true
overwrite_original_rules=true

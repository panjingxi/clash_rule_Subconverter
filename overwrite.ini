[custom]

; ==============================
; 高优先级自定义规则
; ==============================
ruleset=节点选择,[]DOMAIN-SUFFIX,anyrouter.top

; ==============================
; 专用代理规则
; ==============================
ruleset=电报消息,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo-lite/geosite/telegram.list
ruleset=流媒体,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo-lite/geosite/proxymedia.list
ruleset=AI服务,https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo-lite/geosite/openai.list

; ==============================
; 国内直连
; ==============================
ruleset=全球直连,[]DOMAIN-SUFFIX,local
ruleset=全球直连,[]GEOSITE,CN
ruleset=全球直连,[]GEOIP,CN

; ==============================
; 其他流量
; ==============================
ruleset=漏网之鱼,[]FINAL


; ==============================
; 代理组
; ==============================

; 主节点选择
custom_proxy_group=节点选择`select`[]自动选择`[]CF优选`[]手动切换`[]DIRECT

; 自动选择延迟最低节点
custom_proxy_group=自动选择`url-test`.*`http://www.gstatic.com/generate_204`1600,,50

; 手动选择节点
custom_proxy_group=手动切换`select`.*

; ==============================
; Cloudflare / CF 优选
; ==============================
custom_proxy_group=CF优选`url-test`(CF优选|优选CF|CF优选IP|CF优选节点|CF-IP|CFIP|Cloudflare|CloudFlare|Cloudflare-CDN|CF-CDN|CDN-CF|Cloudflare优选|Cloudflare优选IP|Cloudflare优选节点|CF-WARP|CF_WARP|CFWARP|Cloudflare-WARP|Cloudflare_WARP|WARP|Warp|warp)`http://www.gstatic.com/generate_204`3200,,50

; ==============================
; DNS 出口
; ==============================
custom_proxy_group=DNS出口`select`[]节点选择`[]自动选择`[]DIRECT

; ==============================
; Telegram
; ==============================
custom_proxy_group=电报消息`select`[]节点选择`[]自动选择`[]DIRECT

; ==============================
; AI 服务
; ==============================
custom_proxy_group=AI服务`select`[]节点选择`[]自动选择`[]DIRECT

; ==============================
; 流媒体
; ==============================
custom_proxy_group=流媒体`select`[]节点选择`[]自动选择`[]DIRECT

; ==============================
; 国内直连
; ==============================
custom_proxy_group=全球直连`select`[]DIRECT`[]节点选择

; ==============================
; 漏网之鱼
; ==============================
custom_proxy_group=漏网之鱼`select`[]节点选择`[]自动选择`[]DIRECT


; ==============================
; 规则生成
; ==============================
enable_rule_generator=true
overwrite_original_rules=true
